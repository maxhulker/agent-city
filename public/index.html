<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent City</title>
<style>
  :root {
    --bg: #070d1c;
    --panel: #0f172a;
    --line: #1e293b;
    --text: #e2e8f0;
    --dim: #94a3b8;
    --accent: #fbbf24;
    --red: #f87171;
    --side: 300px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    flex: none;
    padding: 0 10px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 12px; letter-spacing: .14em; margin: 0 8px 0 0; }
  .btn {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    font: inherit;
    cursor: pointer;
  }
  header .btn { padding: 1px 10px; font-size: 12px; }
  .btn:hover { border-color: var(--dim); }
  #link { margin-left: auto; color: var(--dim); display: flex; align-items: center; gap: 6px; font-size: 12px; }
  #link i { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; }
  #link.on i { background: #4ade80; }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) var(--side); min-height: 0; position: relative; }
  body.collapsed main { grid-template-columns: minmax(0, 1fr) 0; }
  body.collapsed aside { display: none; }
  #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #map { position: absolute; inset: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; }
  #map.dragging { cursor: grabbing; }
  #map svg { width: 100%; height: 100%; display: block; }
  .agent { cursor: pointer; }
  .agent:hover .bubble, .agent.sel .bubble, .agent.waiting .bubble { display: inline; }
  #map .sel .ring { display: inline; animation: ringpulse 1.6s ease-in-out infinite; }
  @keyframes ringpulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  #map [data-session] { cursor: pointer; }

  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  #title { position: absolute; top: 12px; left: 14px; text-shadow: 0 1px 6px #000c; }
  #title b { font-size: 16px; letter-spacing: .16em; display: block; }
  #title .sub { color: var(--dim); font-size: 12px; }
  #counts { color: var(--accent); font-size: 12px; }
  #pills { position: absolute; top: 12px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .pill { pointer-events: auto; cursor: pointer; border: 1px solid; border-radius: 999px; padding: 4px 12px; font: inherit; font-weight: 600; box-shadow: 0 4px 14px #0008; }
  .pill.red { background: #3b1016; color: #fecaca; border-color: #b91c1c; }
  .pill.amber { background: #3a2a07; color: #fde68a; border-color: #b45309; }
  .pill:hover { filter: brightness(1.25); }

  #ticker {
    position: absolute; left: 0; right: 0; bottom: 0; height: 30px; z-index: 3;
    background: #0a0703; border-top: 1px solid #3a2a07; overflow: hidden; pointer-events: none;
    box-shadow: 0 -4px 18px #000a;
  }
  #ticker::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, #0006 2px 3px);
  }
  #track { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: center; white-space: nowrap; will-change: transform;
    font: 700 14px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .14em; text-transform: uppercase;
    color: #ffb830; text-shadow: 0 0 6px #ff9a1faa, 0 0 14px #ff9a1f55; }
  #track .seg { display: inline-flex; align-items: center; flex: none; }
  #track .it { display: inline-flex; align-items: center; gap: 8px; }
  #track .sep { margin: 0 18px; color: #b45309; }
  #track .bul { text-shadow: none; }

  .bul { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%;
    font: 700 11px/1 ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: #fff; flex: none; letter-spacing: 0; text-transform: none; }
  .bul.sm { width: 14px; height: 14px; font-size: 9px; }

  aside { border-left: 1px solid var(--line); overflow-y: auto; padding: 12px 14px 24px; background: var(--bg); min-height: 0; }
  h2 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 18px 0 8px; }
  h2:first-child { margin-top: 4px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .card.alert { border-color: #7f1d1d; background: #1f0f14; }
  .card.ask { border-color: #713f12; background: #1c1508; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row > .bul { align-self: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; transform: translateY(1px); }
  .name { font-weight: 600; }
  .dim { color: var(--dim); }
  .small { font-size: 12px; }
  .path { font-size: 11px; color: var(--dim); word-break: break-all; }
  .agents { margin: 6px 0 0 17px; padding: 0; list-style: none; }
  .agents li { margin: 3px 0; }
  .status { font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--line); color: var(--dim); }
  .status.working { background: #14532d; color: #bbf7d0; }
  .status.waiting { background: #713f12; color: #fde68a; }
  .status.failed { background: #7f1d1d; color: #fecaca; }
  .log { list-style: none; padding: 0; margin: 0; }
  .log li { padding: 3px 0; border-bottom: 1px solid var(--line); }
  .empty { color: var(--dim); font-style: italic; }
  #toasts { position: fixed; bottom: 46px; left: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 10; pointer-events: none; }
  .toast { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 8px 14px; box-shadow: 0 8px 24px #0008; animation: fade 5s forwards; }
  @keyframes fade { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
  .card[data-session-card] { cursor: pointer; }
  .card[data-session-card].selected { border-color: var(--accent); }
  .agents li[data-session-card] { cursor: pointer; }
  .fold { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
  .fold .chev { display: inline-block; transition: transform .15s; width: 10px; }
  .fold.shut .chev { transform: rotate(-90deg); }
  .fold .tcount { margin-left: auto; color: var(--accent); letter-spacing: 0; text-transform: none; font-weight: 400; }
  #nt-body.shut { display: none; }
  .field, .compose textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; }
  .field:focus, .compose textarea:focus { outline: none; border-color: var(--dim); }
  select.field { padding: 4px 6px; }
  textarea.field, .compose textarea { resize: none; display: block; }
  #newform label { display: block; font-size: 11px; color: var(--dim); margin: 8px 0 3px; }
  #newform label:first-child { margin-top: 0; }
  #newform .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  [hidden] { display: none !important; }
  .warn { color: #fbbf24; font-size: 11px; margin-top: 4px; }
  .err { color: var(--red); font-size: 12px; margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
  .err:empty { display: none; }
  .btn.primary { background: #3a2a07; border-color: #b45309; color: #fde68a; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sm { padding: 0 9px; font-size: 11px; }
  .compose { display: flex; gap: 6px; align-items: flex-end; margin-top: 8px; cursor: default; }
  .compose textarea { flex: 1; min-height: 26px; max-height: 88px; overflow-y: auto; font-size: 12px; }
  .compose .btn { padding: 2px 10px; font-size: 12px; }
  .hint { font-size: 11px; color: var(--dim); margin-top: 3px; }
  .msgs { cursor: default; }
  .msg { display: flex; align-items: baseline; gap: 6px; margin-top: 5px; font-size: 12px; }
  .msg .mt { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }
  .msg.delivered .mt { color: var(--dim); }
  .chip { font-size: 10px; padding: 0 6px; border-radius: 999px; background: var(--line); color: var(--dim); flex: none; white-space: nowrap; }
  .chip.queued { background: #713f12; color: #fde68a; }
  .chip.delivered { background: #14532d; color: #bbf7d0; }
  .chip.running { background: #1e3a8a; color: #bfdbfe; }
  .chip.done { background: #14532d; color: #bbf7d0; }
  .chip.failed { background: #7f1d1d; color: #fecaca; }
  .xbtn { background: none; border: 0; color: var(--dim); cursor: pointer; font: inherit; padding: 0 3px; flex: none; }
  .xbtn:hover { color: var(--red); }
  .spin { display: inline-block; width: 8px; height: 8px; border: 2px solid #93c5fd55; border-top-color: #bfdbfe; border-radius: 50%; animation: spin .8s linear infinite; margin-right: 4px; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #tasks { margin-top: 10px; }
  .task { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .task.link { cursor: pointer; }
  .task .tp { font-size: 11px; color: var(--dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task .res { margin: 6px 0 0; padding: 6px 8px; background: var(--bg); border-radius: 6px; font: 11px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; cursor: text; }
  .task .res.bad { color: var(--red); }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr) !important; }
    aside { position: absolute; top: 0; right: 0; bottom: 0; width: min(var(--side), 86vw); z-index: 5; box-shadow: -8px 0 24px #000a; }
  }
</style>
</head>
<body>
<header>
  <h1>AGENT CITY</h1>
  <button class="btn" id="fit" title="Reset zoom (0)">Fit</button>
  <span id="link"><i></i><span>Connecting…</span></span>
  <button class="btn" id="sidebtn" title="Show or hide the panel">Panel</button>
</header>
<main>
  <div id="stage">
    <div id="map"></div>
    <div id="hud">
      <div id="title"><b>AGENT CITY</b><div class="sub" id="sub">Manhattan</div><div id="counts"></div></div>
      <div id="pills"></div>
    </div>
    <div id="ticker"><div id="track"></div></div>
  </div>
  <aside id="side">
    <section id="newtask">
      <h2 class="fold" id="nt-head" role="button" tabindex="0"><span class="chev">&#9662;</span>New task<span class="tcount" id="nt-count"></span></h2>
      <div id="nt-body">
        <div id="newform">
          <label for="nt-folder">Folder</label>
          <select class="field" id="nt-folder"><option value="__other">Other folder...</option></select>
          <input class="field" id="nt-other" placeholder="Full path to a folder" style="margin-top:6px" spellcheck="false">
          <label for="nt-prompt">What should it do?</label>
          <textarea class="field" id="nt-prompt" rows="3" placeholder="Describe the task..."></textarea>
          <div class="two">
            <div><label for="nt-level">Permissions</label>
              <select class="field" id="nt-level">
                <option value="read">Read only</option>
                <option value="edit">Can edit files</option>
                <option value="run">Can edit and run commands</option>
              </select></div>
            <div><label for="nt-effort">Effort</label>
              <select class="field" id="nt-effort">
                <option value="default">Default</option><option value="low">Low</option>
                <option value="medium">Medium</option><option value="high">High</option>
                <option value="xhigh">Extra high</option><option value="max">Max</option>
              </select></div>
          </div>
          <div class="two">
            <div><label for="nt-model">Model</label>
              <select class="field" id="nt-model">
                <option value="default">Default</option><option value="fable">Fable</option>
                <option value="opus">Opus</option><option value="sonnet">Sonnet</option>
                <option value="haiku">Haiku</option>
              </select></div>
            <div><label for="nt-version">Version</label>
              <select class="field" id="nt-version"></select></div>
          </div>
          <input class="field" id="nt-id" placeholder="Full model ID, e.g. claude-opus-5-5" style="margin-top:6px" spellcheck="false" hidden>
          <div class="warn" id="nt-warn" hidden>Warning: this level may run any shell command in that folder.</div>
          <div style="margin-top:8px"><button class="btn primary" id="nt-start" type="button">Start</button></div>
          <div class="err" id="nt-err"></div>
        </div>
        <div id="tasks"></div>
      </div>
    </section>
    <div id="needs"></div>
    <h2>Sessions</h2>
    <div id="sessions"></div>
    <h2>Boroughs</h2>
    <div id="boroughs"></div>
    <h2>Recent</h2>
    <ul class="log" id="log"></ul>
  </aside>
</main>
<div id="toasts"></div>
<script>
  const $ = id => document.getElementById(id)
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`)
  let selected = ''
  try { selected = localStorage.getItem('agent-city-selected') || '' } catch {}
  let boot = null
  let source

  // ---- zoom / pan -------------------------------------------------------
  // View = zoom plus the visible centre as a fraction (u, v) of the server's fit box.
  const MAXZ = 8
  let view = { z: 1, u: 0.5, v: 0.5 }
  try {
    const v = JSON.parse(localStorage.getItem('agent-city-zoom') || 'null')
    if (v && isFinite(v.z) && isFinite(v.u) && isFinite(v.v)) view = { z: Math.min(MAXZ, Math.max(1, v.z)), u: v.u, v: v.v }
  } catch {}
  let base = null // [x, y, w, h] from the svg's own viewBox

  const svgEl = () => $('map').querySelector('svg')

  function readBase(svg) {
    const p = (svg.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number)
    if (p.length === 4 && p.every(isFinite) && p[2] > 0 && p[3] > 0) base = p
  }

  function applyView() {
    const svg = svgEl()
    if (!svg || !base) return
    view.z = Math.min(MAXZ, Math.max(1, view.z))
    view.u = Math.min(1, Math.max(0, view.u))
    view.v = Math.min(1, Math.max(0, view.v))
    const [bx, by, bw, bh] = base
    const w = bw / view.z, h = bh / view.z
    const cx = bx + view.u * bw, cy = by + view.v * bh
    svg.setAttribute('viewBox', `${cx - w / 2} ${cy - h / 2} ${w} ${h}`)
    svg.style.setProperty('--zt', String(1 / view.z))
    svg.style.setProperty('--zs', String(1 / Math.pow(view.z, 0.6)))
    svg.classList.toggle('z2', view.z >= 2)
    svg.classList.toggle('z4', view.z >= 4)
  }

  function saveView() {
    try { localStorage.setItem('agent-city-zoom', JSON.stringify(view)) } catch {}
  }

  // client point -> svg user coordinates (honours preserveAspectRatio)
  function toUser(svg, cx, cy) {
    const m = svg.getScreenCTM()
    if (!m) return null
    const pt = new DOMPoint(cx, cy).matrixTransform(m.inverse())
    return pt
  }

  function zoomAt(factor, cx, cy) {
    const svg = svgEl()
    if (!svg || !base) return
    const before = toUser(svg, cx, cy)
    view.z = Math.min(MAXZ, Math.max(1, view.z * factor))
    applyView()
    const after = toUser(svg, cx, cy)
    if (before && after) {
      view.u += (before.x - after.x) / base[2]
      view.v += (before.y - after.y) / base[3]
      applyView()
    }
    saveView()
  }

  function fit() { view = { z: 1, u: 0.5, v: 0.5 }; applyView(); saveView() }

  const map = $('map')
  map.addEventListener('wheel', e => {
    e.preventDefault()
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY
    zoomAt(Math.pow(1.0015, -dy), e.clientX, e.clientY)
  }, { passive: false })

  let drag = null, justDragged = false
  map.addEventListener('mousedown', e => {
    if (e.button !== 0) return
    drag = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false }
  })
  window.addEventListener('mousemove', e => {
    if (!drag) return
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 4) return
    if (!drag.moved) { drag.moved = true; map.classList.add('dragging') }
    const svg = svgEl()
    const m = svg && svg.getScreenCTM()
    if (m && base) {
      view.u -= (e.clientX - drag.lx) / m.a / base[2]
      view.v -= (e.clientY - drag.ly) / m.d / base[3]
      applyView()
    }
    drag.lx = e.clientX; drag.ly = e.clientY
  })
  window.addEventListener('mouseup', () => {
    if (!drag) return
    if (drag.moved) { justDragged = true; setTimeout(() => { justDragged = false }, 0); saveView() }
    map.classList.remove('dragging')
    drag = null
  })
  // swallow the click that ends a drag so it never changes the selection
  map.addEventListener('click', e => { if (justDragged) { e.stopPropagation(); e.preventDefault() } }, true)
  map.addEventListener('dblclick', e => { zoomAt(2, e.clientX, e.clientY) })
  $('fit').addEventListener('click', fit)
  window.addEventListener('keydown', e => {
    if (e.key === '0' && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) fit()
  })
  window.addEventListener('resize', () => applyView())

  // ---- sidebar toggle ---------------------------------------------------
  function setCollapsed(c) {
    document.body.classList.toggle('collapsed', c)
    try { localStorage.setItem('agent-city-collapsed', c ? '1' : '0') } catch {}
  }
  let side = null
  try { side = localStorage.getItem('agent-city-collapsed') } catch {}
  setCollapsed(side === null ? window.innerWidth <= 900 : side === '1')
  $('sidebtn').addEventListener('click', () => setCollapsed(!document.body.classList.contains('collapsed')))

  // ---- connection -------------------------------------------------------
  function connect() {
    source?.close()
    source = new EventSource('/stream')
    source.onopen = () => { $('link').className = 'on'; $('link').lastChild.textContent = 'Live' }
    source.onerror = () => { $('link').className = ''; $('link').lastChild.textContent = 'Reconnecting…' }
    source.onmessage = e => {
      const { svg, meta } = JSON.parse(e.data)
      if (meta.boot != null) {
        if (boot === null) boot = meta.boot
        else if (meta.boot !== boot) { location.reload(); return }
      }
      $('map').innerHTML = svg
      const el = svgEl()
      if (el) { readBase(el); applyView() }
      draw(meta)
      applySel(false)
    }
  }

  async function post(path, args) {
    try {
      const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(args) })
      return await r.json().catch(() => ({ error: r.ok ? '' : `HTTP ${r.status}` }))
    } catch (e) {
      return { error: String(e?.message || e) }
    }
  }

  function ago(at) {
    const s = Math.max(0, Math.round((Date.now() - at) / 1000))
    return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`
  }

  function applySel(scroll) {
    for (const g of document.querySelectorAll('#map .sel')) g.classList.remove('sel')
    for (const c of document.querySelectorAll('[data-session-card].selected')) c.classList.remove('selected')
    if (!selected) return
    const id = CSS.escape(selected)
    for (const g of document.querySelectorAll(`#map [data-session="${id}"]`)) g.classList.add('sel')
    const card = document.querySelector(`.card[data-session-card="${id}"]`)
    if (card) {
      card.classList.add('selected')
      if (scroll) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
    }
  }

  function select(id, scroll) {
    selected = id && id !== selected ? id : ''
    try { localStorage.setItem('agent-city-selected', selected) } catch {}
    applySel(scroll)
  }

  const bullet = (text, color, small) => text
    ? `<span class="bul${small ? ' sm' : ''}" style="background:${esc(color)}">${esc(text)}</span>` : ''

  // ---- ticker (JS-driven so frames never restart the scroll) ------------
  const SPEED = 55 // px per second
  let tickAt = null, tickHtml = '', pendingHtml = null, tx = 0, segW = 0, lastT = 0

  function tickerSeg(items) {
    if (!items.length) return '<span class="seg"><span class="it">AGENT CITY</span><span class="sep">◆</span><span class="it">WAITING FOR THE FIRST SESSION</span><span class="sep">◆</span></span>'
    return '<span class="seg">' + items.map(t =>
      `<span class="it">${bullet(t.bullet, t.color, true)}<span>${esc(t.who)} ${esc(t.text)}</span></span><span class="sep">◆</span>`).join('') + '</span>'
  }

  function installTicker(seg) {
    const track = $('track')
    track.innerHTML = seg
    segW = track.firstChild.getBoundingClientRect().width || 1
    const need = Math.ceil(($('ticker').clientWidth || 1200) / segW) + 1
    track.innerHTML = seg.repeat(need + 1)
    tickHtml = seg
  }

  function updateTicker(items) {
    const at = items.length ? items[0].at : 0
    if (at === tickAt && tickHtml) return
    tickAt = at
    const seg = tickerSeg(items)
    if (!tickHtml) { tx = $('ticker').clientWidth; installTicker(seg) } // first paint: enter from the right
    else pendingHtml = seg // swap at the next loop boundary
  }

  function tickFrame(t) {
    const dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0
    lastT = t
    if (tickHtml) {
      tx -= SPEED * dt
      if (tx <= -segW) {
        tx += segW
        if (pendingHtml) { installTicker(pendingHtml); pendingHtml = null }
      }
      $('track').style.transform = `translateX(${tx.toFixed(2)}px)`
    }
    requestAnimationFrame(tickFrame)
  }
  requestAnimationFrame(tickFrame)

  // ---- sessions: cards are kept (keyed by id) so the message fields survive every frame ----
  let lastMeta = null
  const cards = new Map()
  const MSG_TTL = 10 * 60 * 1000
  const VIA = { tool: 'mid-task', prompt: 'with your prompt', stop: 'at end of turn' }

  function headHtml(s) {
    const lead = s.agents.find(a => a.isMain)
    const subs = s.agents.filter(a => !a.isMain)
    return `<div class="row">${s.bullet ? bullet(s.bullet, s.color) : `<span class="dot" style="background:${esc(s.color)}"></span>`}
        <span class="name">${esc(lead?.name ?? s.name)}</span>
        ${lead ? `<span class="status ${esc(lead.status)}">${esc(lead.status)}</span>` : ''}</div>
      <div class="path" style="margin-left:26px">${esc(s.cwd)}</div>
      ${lead ? `<div class="small dim" style="margin-left:26px">${esc(lead.where)} · ${esc(lead.activity)}</div>` : ''}
      ${subs.length ? `<ul class="agents">${subs.map(a => `<li data-session-card="${esc(s.id)}"><div class="row">${s.bullet ? bullet(s.bullet, a.color || s.color, true) : `<span class="dot" style="background:${esc(a.color)}"></span>`}
        <span>${esc(a.name)}</span><span class="status ${esc(a.status)}">${esc(a.status)}</span></div>
        <div class="small dim" style="margin-left:22px">${esc(a.where)} · ${esc(a.activity)}</div></li>`).join('')}</ul>` : ''}`
  }

  function msgsHtml(s) {
    const now = Date.now()
    return (s.messages || []).filter(x => x.status === 'queued' || now - (x.deliveredAt || x.at) < MSG_TTL).map(x =>
      x.status === 'queued'
        ? `<div class="msg queued"><span class="chip queued">queued</span><span class="mt">${esc(x.text)}</span><button class="xbtn" title="Cancel" data-msg-cancel="${esc(x.id)}" data-sid="${esc(s.id)}">×</button></div>`
        : `<div class="msg delivered"><span class="chip delivered">delivered${x.via && VIA[x.via] ? ' · ' + VIA[x.via] : ''}</span><span class="mt">${esc(x.text)}</span></div>`
    ).join('')
  }

  function makeCard(id) {
    const el = document.createElement('div')
    el.className = 'card'
    el.dataset.sessionCard = id
    el.innerHTML = '<div class="shead"></div>' +
      '<div class="compose"><textarea class="msg-in" rows="1" placeholder="Message this session…" aria-label="Message this session"></textarea><button class="btn" type="button" data-send="1">Send</button></div>' +
      '<div class="hint">Delivered at its next step; an idle session gets it when it next does something.</div>' +
      '<div class="err cerr"></div><div class="msgs"></div>'
    return { el, head: el.querySelector('.shead'), msgs: el.querySelector('.msgs'), err: el.querySelector('.cerr'), ta: el.querySelector('textarea'), h: '', mh: '' }
  }

  function growTa(ta) {
    ta.style.height = 'auto'
    ta.style.height = Math.min(ta.scrollHeight + 2, 88) + 'px'
  }

  function drawSessions(m) {
    const box = $('sessions')
    const ids = new Set(m.sessions.map(s => s.id))
    for (const [id, c] of cards) if (!ids.has(id)) { c.el.remove(); cards.delete(id) }
    let empty = $('sess-empty')
    if (!m.sessions.length) {
      if (!empty) { empty = document.createElement('div'); empty.id = 'sess-empty'; empty.className = 'empty'; empty.textContent = 'No sessions yet. Start Claude Code anywhere on this machine.'; box.append(empty) }
      return
    }
    empty?.remove()
    let prev = null
    for (const s of m.sessions) {
      let c = cards.get(s.id)
      if (!c) { c = makeCard(s.id); cards.set(s.id, c) }
      const h = headHtml(s)
      if (h !== c.h) { c.head.innerHTML = h; c.h = h }
      const mh = msgsHtml(s)
      if (mh !== c.mh) { c.msgs.innerHTML = mh; c.mh = mh }
      c.el.classList.toggle('selected', s.id === selected)
      const want = prev ? prev.nextSibling : box.firstChild
      if (c.el !== want) {
        const ae = document.activeElement
        const keep = ae && c.el.contains(ae) && ae.tagName === 'TEXTAREA' ? { ae, a: ae.selectionStart, b: ae.selectionEnd } : null
        box.insertBefore(c.el, want)
        if (keep) { keep.ae.focus(); try { keep.ae.setSelectionRange(keep.a, keep.b) } catch {} }
      }
      prev = c.el
    }
  }

  async function sendMessage(c, sid) {
    const text = c.ta.value.trim()
    if (!text) return
    c.err.textContent = ''
    const r = await post('/message', { session: sid, text })
    if (r.error || r.ok === false) { c.err.textContent = r.error || 'Not sent.'; return }
    if (c.ta.value.trim() === text) { c.ta.value = ''; growTa(c.ta) }
  }

  document.addEventListener('input', e => { if (e.target.matches?.('textarea.msg-in')) growTa(e.target) })
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || !e.target.matches?.('textarea.msg-in')) return
    e.preventDefault()
    const el = e.target.closest('[data-session-card]')
    const c = el && cards.get(el.dataset.sessionCard)
    if (c) sendMessage(c, el.dataset.sessionCard)
  })

  // ---- new task ----------------------------------------------------------
  let ntOpen = true
  try { ntOpen = localStorage.getItem('agent-city-newtask') !== '0' } catch {}
  function setNt(open) {
    ntOpen = open
    $('nt-body').classList.toggle('shut', !open)
    $('nt-head').classList.toggle('shut', !open)
    try { localStorage.setItem('agent-city-newtask', open ? '1' : '0') } catch {}
  }
  setNt(ntOpen)
  $('nt-head').addEventListener('click', () => setNt(!ntOpen))
  $('nt-head').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setNt(!ntOpen) } })

  // Each model's versions: "Latest" follows the alias; a pinned ID stays put.
  // "Other model ID…" takes any full ID, e.g. an older version or one with [1m].
  const VERSIONS = {
    default: [['default', 'Your default']],
    fable: [['fable', 'Latest'], ['claude-fable-5-1', 'Fable 5.1']],
    opus: [['opus', 'Latest'], ['claude-opus-5-5', 'Opus 5.5']],
    sonnet: [['sonnet', 'Latest'], ['claude-sonnet-5-5', 'Sonnet 5.5']],
    haiku: [['haiku', 'Latest'], ['claude-haiku-5-5', 'Haiku 5.5']],
  }
  function syncVersions() {
    const family = $('nt-model').value
    const list = [...(VERSIONS[family] || VERSIONS.default)]
    if (family !== 'default') list.push(['__id', 'Other model ID…'])
    $('nt-version').innerHTML = list.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('')
    $('nt-version').disabled = family === 'default'
    syncId()
  }
  function syncId() { $('nt-id').hidden = $('nt-version').value !== '__id' }
  $('nt-model').addEventListener('change', syncVersions)
  $('nt-version').addEventListener('change', syncId)
  syncVersions()

  function syncOther() { $('nt-other').hidden = $('nt-folder').value !== '__other' }
  function syncWarn() { $('nt-warn').hidden = $('nt-level').value !== 'run' }
  $('nt-folder').addEventListener('change', syncOther)
  $('nt-level').addEventListener('change', syncWarn)
  syncOther(); syncWarn()
  $('nt-prompt').addEventListener('input', e => growTa(e.target))

  let placesKey = ''
  function drawPlaces(places) {
    const key = JSON.stringify(places)
    if (key === placesKey) return
    placesKey = key
    const sel = $('nt-folder'), cur = sel.value
    sel.innerHTML = places.map(p => `<option value="${esc(p.path)}">${esc(p.name)} — ${esc(p.path)}</option>`).join('') + '<option value="__other">Other folder…</option>'
    if (cur && cur !== '__other' && [...sel.options].some(o => o.value === cur)) sel.value = cur
    else if (places.length && (!cur || cur === '__other') && !$('nt-other').value) sel.value = places[0].path
    else sel.value = '__other'
    syncOther()
  }

  $('nt-start').addEventListener('click', async () => {
    const btn = $('nt-start'), err = $('nt-err')
    const cwd = ($('nt-folder').value === '__other' ? $('nt-other').value : $('nt-folder').value).trim()
    const prompt = $('nt-prompt').value.trim()
    if (!cwd) { err.textContent = 'Pick a folder.'; return }
    if (!prompt) { err.textContent = 'Describe the task first.'; return }
    const model = $('nt-version').value === '__id' ? $('nt-id').value.trim() : $('nt-version').value
    if (!model) { err.textContent = 'Enter a model ID.'; return }
    err.textContent = ''
    btn.disabled = true
    const r = await post('/task', { cwd, prompt, level: $('nt-level').value, model, effort: $('nt-effort').value })
    btn.disabled = false
    if (r.error || r.ok === false) { err.textContent = r.error || 'The task was not started.'; return }
    if ($('nt-prompt').value.trim() === prompt) { $('nt-prompt').value = ''; growTa($('nt-prompt')) }
  })

  const openTasks = new Set()
  const taskEls = new Map()
  const baseName = p => String(p || '').replace(/[\\/]+$/, '').split(/[\\/]/).pop() || String(p || '')
  function dur(ms) {
    const s = Math.max(0, Math.round(ms / 1000))
    return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m`
  }

  // What was asked for, and what actually answered once it's known.
  function modelLabel(t) {
    const asked = !t.model || t.model === 'default' ? 'default model' : t.model
    const effort = t.effort && t.effort !== 'default' ? ` · ${t.effort} effort` : ''
    const used = (t.usedModels || []).filter(m => m !== t.model)
    return `${asked}${effort}${used.length ? ` · ran on ${used.join(', ')}` : ''}`
  }

  function taskHtml(t) {
    const running = t.status === 'running'
    const time = dur((t.endedAt || Date.now()) - t.startedAt)
    const bad = t.status === 'failed' || !!t.error
    const body = bad ? (t.error || t.result || '') : (t.result || '')
    const can = !running && !!body
    const open = can && openTasks.has(t.id)
    return `<div class="row"><span class="name">${esc(baseName(t.cwd))}</span>
        <span class="chip ${esc(t.status)}">${running ? '<span class="spin"></span>' : ''}${esc(t.status)}</span>
        <span class="dim small">${esc(time)}${t.costUsd != null ? ' · $' + Number(t.costUsd).toFixed(2) : ''}</span>
        <span style="margin-left:auto">${running ? `<button class="btn sm" data-task-stop="${esc(t.id)}">Stop</button>` : can ? `<button class="btn sm" data-task-toggle="${esc(t.id)}">${open ? 'Hide' : 'Result'}</button>` : ''}</span></div>
      <div class="tp" title="${esc(t.prompt)}">${esc(t.prompt)}</div>
      <div class="dim small">${esc(modelLabel(t))}</div>
      ${open ? `<pre class="res${bad ? ' bad' : ''}">${esc(body)}</pre>` : ''}`
  }

  function drawTasks(m) {
    drawPlaces(m.places || [])
    const tasks = m.tasks || []
    const nrun = tasks.filter(t => t.status === 'running').length
    $('nt-count').textContent = nrun ? `${nrun} running` : ''
    const box = $('tasks')
    const ids = new Set(tasks.map(t => t.id))
    for (const [id, c] of taskEls) if (!ids.has(id)) { c.el.remove(); taskEls.delete(id) }
    let prev = null
    for (const t of tasks) {
      let c = taskEls.get(t.id)
      if (!c) { c = { el: document.createElement('div'), h: '' }; c.el.className = 'task'; c.el.dataset.taskId = t.id; taskEls.set(t.id, c) }
      const linked = !!(t.sessionId && m.sessions.some(s => s.id === t.sessionId))
      c.el.classList.toggle('link', linked)
      if (linked) c.el.dataset.taskSession = t.sessionId; else delete c.el.dataset.taskSession
      const h = taskHtml(t)
      if (h !== c.h) { c.el.innerHTML = h; c.h = h }
      const want = prev ? prev.nextSibling : box.firstChild
      if (c.el !== want) box.insertBefore(c.el, want)
      prev = c.el
    }
    if (!tasks.length) { if (!$('tasks-empty')) box.insertAdjacentHTML('beforeend', '<div class="empty" id="tasks-empty">No tasks yet.</div>') }
    else $('tasks-empty')?.remove()
  }

  // ---- sidebar + overlays ------------------------------------------------
  function draw(m) {
    const conflicts = m.conflicts || [], asks = m.asks || []

    $('sub').textContent = `Manhattan · ${m.home || 'the first repository seen'}`
    const c = m.counts
    $('counts').textContent = c ? `${c.sessions} session${c.sessions === 1 ? '' : 's'} · ${c.working} working · ${c.subagents} subagent${c.subagents === 1 ? '' : 's'}` : ''
    $('pills').innerHTML =
      (conflicts.length ? `<button class="pill red" data-needs="1">⚠ ${conflicts.length} merge conflict${conflicts.length === 1 ? '' : 's'} at the Seaport</button>` : '') +
      (asks.length ? `<button class="pill amber" data-needs="1">? ${asks.length} waiting at City Hall</button>` : '')

    updateTicker(m.ticker || [])

    let needs = ''
    for (const c of conflicts) {
      needs += `<div class="card alert"><div class="name">⚠ Merge conflict · ${esc(c.agentName)}</div>
        <div class="small dim">${esc(c.files.length ? c.files.join(', ') : c.command)}</div>
        <div style="margin-top:6px"><button class="btn" data-resolve="${esc(c.id)}">Mark resolved</button></div></div>`
    }
    for (const q of asks) {
      needs += `<div class="card ask"><div class="name">? ${esc(q.who)}</div><div class="small dim">${esc(q.label)}</div></div>`
    }
    $('needs').innerHTML = needs ? `<h2>Needs you</h2>${needs}` : ''

    lastMeta = m
    drawSessions(m)
    drawTasks(m)

    $('boroughs').innerHTML = `<div class="card"><div class="row"><span class="name">Manhattan</span>
        <span class="dim">${esc(m.home || 'the first repository seen')}</span>
        ${m.homePinned ? '<button class="btn" style="margin-left:auto" data-home-auto="1">Pick automatically</button>' : ''}</div>
        <div class="small dim">${m.homePinned ? 'picked by you' : 'busiest repo, automatic'}</div></div>` +
      m.repos.map(r => `<div class="card"><div class="row"><span class="name">${esc(r.borough)}</span>
        <span class="dim">${esc(r.name)}</span>
        <button class="btn" style="margin-left:auto" data-home="${esc(r.root)}">Make Manhattan</button></div>
        <div class="path">${esc(r.root)}</div></div>`).join('')

    $('log').innerHTML = m.log.length ? m.log.map(l => `<li><span class="row"><span class="dot" style="background:${esc(l.color)}"></span>
      <span><b>${esc(l.who)}</b> ${esc(l.text)} <span class="dim small">${ago(l.at)}</span></span></span></li>`).join('')
      : '<li class="empty">Quiet so far.</li>'

    for (const t of m.toasts || []) {
      const el = document.createElement('div')
      el.className = 'toast'
      el.textContent = t
      $('toasts').append(el)
      setTimeout(() => el.remove(), 5200)
    }
  }

  document.addEventListener('click', e => {
    const b = e.target.closest('button')
    if (!b) {
      if (e.target.closest('.compose, .msgs, .res, .cerr')) return
      const tk = e.target.closest('[data-task-session]')
      if (tk) { if (selected !== tk.dataset.taskSession) select(tk.dataset.taskSession, true); return }
      const card = e.target.closest('[data-session-card]')
      if (card) { select(card.dataset.sessionCard, false); return }
      if (e.target.closest('#map')) {
        const g = e.target.closest('[data-session]')
        if (g) select(g.dataset.session, true)
        else if (selected) select('', false)
      }
      return
    }
    if (b.dataset.send) {
      const el = b.closest('[data-session-card]'), c = el && cards.get(el.dataset.sessionCard)
      if (c) sendMessage(c, el.dataset.sessionCard)
    } else if (b.dataset.msgCancel) {
      const c = cards.get(b.dataset.sid)
      post('/message/cancel', { session: b.dataset.sid, id: b.dataset.msgCancel }).then(r => { if (c && (r.error || r.ok === false)) c.err.textContent = r.error || 'Could not cancel.' })
    } else if (b.dataset.taskStop) {
      post('/task/stop', { id: b.dataset.taskStop })
    } else if (b.dataset.taskToggle) {
      const id = b.dataset.taskToggle
      if (openTasks.has(id)) openTasks.delete(id); else openTasks.add(id)
      const c = taskEls.get(id), t = lastMeta?.tasks?.find(x => x.id === id)
      if (c && t) { c.h = taskHtml(t); c.el.innerHTML = c.h }
    } else if (b.dataset.needs) {
      setCollapsed(false)
      ;($('needs').firstChild || $('side')).scrollIntoView?.({ block: 'start', behavior: 'smooth' })
    } else if (b.dataset.homeAuto) {
      post('/home', { auto: true })
    } else if (b.dataset.resolve) {
      post('/resolve', { id: b.dataset.resolve })
    } else if (b.dataset.home) {
      post('/home', { root: b.dataset.home })
    }
  })

  connect()
</script>
<style>
  #tip { position: fixed; z-index: 20; max-width: 300px; pointer-events: none; display: none;
    background: #0f172aee; border: 1px solid #334155; border-left: 3px solid var(--accent, #fbbf24);
    border-radius: 8px; padding: 8px 10px; box-shadow: 0 8px 24px #0009; font-size: 12px; }
  #tip b { display: block; font-size: 13px; margin-bottom: 2px; }
  #tip .more { margin-top: 6px; color: var(--dim); white-space: pre-line; }
</style>
<div id="tip"></div>
<script>
  // Hovering a place on the map shows what it stands for and who's there.
  const tip = document.getElementById('tip')
  document.getElementById('map').addEventListener('mousemove', e => {
    const zone = !e.buttons && !e.target.closest('.agent') && e.target.closest('[data-tip-title]')
    if (!zone) { tip.style.display = 'none'; return }
    const d = zone.dataset
    tip.style.setProperty('--accent', zone.style.getPropertyValue('--accent') || '#fbbf24')
    tip.innerHTML = `<b>${esc(d.tipTitle)}</b>${esc(d.tipText)}${d.tipMore ? `<div class="more">${esc(d.tipMore)}</div>` : ''}`
    tip.style.display = 'block'
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)
    const y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8)
    tip.style.left = `${x}px`
    tip.style.top = `${y}px`
  })
  document.getElementById('map').addEventListener('mouseleave', () => { tip.style.display = 'none' })
</script>
</body>
</html>
